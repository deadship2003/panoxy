# panoxy build/release (single unified entry).
#   push main     -> run tests + build linux amd64/arm64 single binaries -> upload workflow artifacts
#   manual        -> Actions sidebar "Build & Release" -> Run workflow (optionally package and publish a Release)
#   push v*/V* tag-> after tests pass, package dual-arch offline bundles and publish a GitHub Release
# Local and CI share one source of truth: all compile/package logic lives in
# build.sh + Makefile (locally reproducible).
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty = auto: tag name for tags, else git describe / V0.0.1-dev)'
        required: false
        default: ''
      arch:
        description: 'Target arch (affects "build artifacts" only; releases always package dual-arch)'
        required: false
        default: 'all'
        type: choice
        options: [amd64, arm64, all]
      publish_release:
        description: 'Package offline bundles and publish a GitHub Release (a manual publish must fill in version)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ['v*', 'V*']

permissions:
  contents: write
  actions: write

# Concurrency: keep only the newest build per ref; older runs are terminated.
# main is protected — a new build never interrupts a running job; any other ref
# (tag/manual/non-main branch) cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build (linux amd64 + arm64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Preflight (setup.sh --check)
        run: ./setup.sh --check

      - name: Test
        run: make test

      - name: Determine version
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) VER="${GITHUB_REF_NAME}" ;;
              *) VER="$(git describe --tags 2>/dev/null || echo V0.0.1-dev)" ;;
            esac
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          ARCH="${{ github.event.inputs.arch || 'all' }}"
          ./build.sh --arch "$ARCH" --ver "${{ steps.version.outputs.version }}"

      # One artifact per arch, named after the target platform (pushing main leaves arch
      # input empty -> both are uploaded).
      - name: Upload linux amd64
        if: github.event.inputs.arch == '' || github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: panoxy-linux-amd64
          path: bin/panoxy-linux-amd64
          if-no-files-found: error

      - name: Upload linux arm64
        if: github.event.inputs.arch == '' || github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: panoxy-linux-arm64
          path: bin/panoxy-linux-arm64
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: panoxy-linux-checksums
          path: bin/sha256sums.txt
          if-no-files-found: error

      # Delete this workflow's historical runs on main (with their artifacts),
      # keeping only the current one.
      - name: Delete old build runs
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "${{ github.workflow }}" --branch main --status completed \
            --limit 100 --json databaseId \
            | jq -r '.[].databaseId' \
            | grep -vx "${{ github.run_id }}" \
            | while read -r id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1 || true
              done

  release:
    name: Package & Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Determine version
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) VER="${GITHUB_REF_NAME}" ;;
              *) VER="$(git describe --tags 2>/dev/null || echo V0.0.1-dev)" ;;
            esac
          fi
          # A manual publish must carry an explicit version, otherwise V0.0.1-dev
          # would leak into a Release.
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ -z "${{ github.event.inputs.version }}" ]; then
            echo "::error::manually publishing a Release requires the version input (e.g. V0.0.1)"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Package (dual-arch offline bundles)
        run: ./build.sh package --arch all --ver "${{ steps.version.outputs.version }}"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          notes="Fully offline installers (dual-arch): the panoxy standalone single-binary build with the mihomo upstream source fused in; geo data (GeoIP/GeoSite/Country.mmdb), ad-block rules, and the metacubexd panel.
          Also plain binaries (single files, copy straight to a target machine and run): panoxy-linux-{amd64,arm64}.
          Integrity check: sha256sum -c panoxy-${TAG}-<arch>.tar.gz.sha256
          Quick start: tar xzf panoxy-${TAG}-<arch>.tar.gz && cd panoxy-${TAG}-<arch> && sudo ./panoxy deploy
          Then import a subscription: sudo panoxy sub import (press enter for paste mode; no quoting needed for the URL)"
          # idempotent: when the Release already exists, (re)upload/overwrite assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/panoxy-${TAG}-*.tar.gz dist/panoxy-${TAG}-*.tar.gz.sha256 \
              bin/panoxy-linux-amd64 bin/panoxy-linux-arm64 --clobber
          else
            gh release create "$TAG" --title "panoxy ${TAG}" --notes "$notes" \
              dist/panoxy-${TAG}-*.tar.gz dist/panoxy-${TAG}-*.tar.gz.sha256 \
              bin/panoxy-linux-amd64 bin/panoxy-linux-arm64
          fi
